# render.yaml — Render Blueprint (Background Workers only)
# Replaces the daemon portions of the GitHub Actions workflows.
#
# NOTE: Render Blueprint does NOT support Cron Jobs via render.yaml. Cron Jobs
# (daily-consolidation, data-collection) must be created manually in the Render
# dashboard under Cron Jobs:
#   Build command:  pip install -r requirements.txt
#   Start command:  python batch/daily_consolidation.py  (or batch/data_collection.py)
#   Schedule:       daily-consolidation -> "0 9 * * *"  (09:00 UTC daily)
#                   data-collection      -> "0 * * * *"   (hourly at :00 UTC)
#
# The three daemon scripts below run infinite polling loops, so they are defined
# here as Background Worker services. These are valid in render.yaml.
#
# Prerequisites in the Render dashboard (Environment tab) BEFORE creating
# resources — add these as environment variables (do NOT commit them):
#   MONGODB_SRV
#   DATABASE_NAME
#   MORRISON_ACCESS_KEY
#   MORRISON_API_BASE_URL
#
# Note: Render Cron Jobs and Background Workers are not available on the free
# tier (Starter+ required). All times are UTC. Trigger manual runs from the
# Render dashboard anytime (replaces workflow_dispatch).

services:
  - type: backgroundWorker
    name: monitor-instruments
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python batch/monitor_instruments.py
    envVars:
      - key: MONGODB_SRV
        fromSecret: MONGODB_SRV
      - key: DATABASE_NAME
        fromSecret: DATABASE_NAME
      - key: MORRISON_ACCESS_KEY
        fromSecret: MORRISON_ACCESS_KEY
      - key: MORRISON_API_BASE_URL
        fromSecret: MORRISON_API_BASE_URL
  - type: backgroundWorker
    name: update-portfolios-risk
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python batch/update_portfolios_and_risk_metrics.py
    envVars:
      - key: MONGODB_SRV
        fromSecret: MONGODB_SRV
      - key: DATABASE_NAME
        fromSecret: DATABASE_NAME
      - key: MORRISON_ACCESS_KEY
        fromSecret: MORRISON_ACCESS_KEY
      - key: MORRISON_API_BASE_URL
        fromSecret: MORRISON_API_BASE_URL
  - type: backgroundWorker
    name: update-prices
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python batch/price_streamer.py
    envVars:
      - key: MONGODB_SRV
        fromSecret: MONGODB_SRV
      - key: DATABASE_NAME
        fromSecret: DATABASE_NAME
      - key: MORRISON_ACCESS_KEY
        fromSecret: MORRISON_ACCESS_KEY
      - key: MORRISON_API_BASE_URL
        fromSecret: MORRISON_API_BASE_URL
